<!DOCTYPE html>
<html lang="rw" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Najm Sights TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--night:#13283B;--gold:#D9A441;--paper:#F5F7F8;--teal:#1E7B6E;--ink:#1A2330;--line:#D7DEE3}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Nunito Sans",Arial,sans-serif;color:var(--ink);background:var(--paper);line-height:1.65;font-size:17px}
html[lang="ar"] body{font-family:"Amiri","Noto Naskh Arabic",serif;font-size:20px;line-height:1.9}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.2}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:"Amiri",serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

header{background:var(--night);color:#fff;position:sticky;top:0;z-index:5}
.bar{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.2rem;text-decoration:none;color:var(--gold)}
nav{display:flex;gap:20px;flex-wrap:wrap}
nav a{text-decoration:none;color:#E8EEF2}
nav a:hover{color:var(--gold)}
.lang{display:flex;gap:6px}
.lang button{background:transparent;color:#E8EEF2;border:1px solid #4A6178;border-radius:6px;padding:5px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--night);border-color:var(--gold)}

.hero{background:var(--night);color:#fff;text-align:center;padding:72px 20px 88px;position:relative;overflow:hidden}
.hero svg{position:absolute;inset-inline-start:50%;top:50%;width:560px;max-width:140%;transform:translate(-50%,-50%);opacity:.18;pointer-events:none}
html[dir="rtl"] .hero svg{transform:translate(50%,-50%)}
.hero>*:not(svg){position:relative}
.bismillah{font-family:"Amiri",serif;font-size:2rem;color:var(--gold);margin-bottom:6px}
.bis-t{color:#B9C7D2;font-size:.95rem;margin-bottom:28px}
.hero h1{font-size:clamp(2.4rem,7vw,4.2rem)}
.hero p.tag{max-width:540px;margin:16px auto 32px;font-size:1.15rem;color:#DCE5EB}
.btn{display:inline-block;background:var(--gold);color:var(--night);font-weight:700;text-decoration:none;padding:13px 28px;border-radius:8px}
.btn:hover{background:#E8B955}

section{max-width:1080px;margin:0 auto;padding:64px 20px}
section h2{font-size:clamp(1.7rem,4vw,2.3rem);color:var(--night);margin-bottom:16px}
.about p{max-width:680px;font-size:1.1rem}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:24px}
.topic{background:#fff;border:1px solid var(--line);border-inline-start:5px solid var(--teal);border-radius:8px;padding:22px}
.topic h3{font-size:1.3rem;margin-bottom:8px;color:var(--night)}
.topic a{color:var(--teal);font-weight:600}
.video{max-width:800px;aspect-ratio:16/9;margin-top:20px;border-radius:8px;overflow:hidden;background:var(--night)}
.video iframe{width:100%;height:100%;border:0;display:block}
.more{display:inline-block;margin-top:16px;color:var(--teal);font-weight:600}
.post{background:#fff;border:1px solid var(--line);border-inline-start:5px solid var(--gold);border-radius:8px;padding:20px;margin-top:16px;max-width:760px}
.post small{color:#5B6B78}
.post h3{color:var(--night);margin:4px 0 8px}
.post p{white-space:pre-line}
form{max-width:560px;margin-top:28px}
form label{display:block;font-weight:600;margin-top:14px}
form input[type=text],form input[type=email],form textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #9AA9B5;border-radius:6px;margin-top:4px;background:#fff}
form textarea{min-height:130px}
form button{margin-top:18px;border:0;cursor:pointer;font:inherit;font-weight:700}
#fmsg{margin-top:12px;font-weight:600;color:var(--teal)}
.hp{position:absolute;left:-9999px}
.contact{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);max-width:none}
.contact .in{max-width:1080px;margin:0 auto}
.contact ul{list-style:none;margin-top:12px}
.contact li{padding:6px 0;font-size:1.1rem}
.contact a{color:var(--teal);font-weight:600}
footer{text-align:center;padding:28px 20px;color:#5B6B78;font-size:.9rem}
@media(max-width:600px){nav{display:none}.hero{padding:48px 20px 64px}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="brand" href="#top">Najm Sights</a>
    <nav>
      <a href="#about" data-i="nav_about"></a>
      <a href="#topics" data-i="nav_topics"></a>
      <a href="#videos" data-i="nav_videos"></a>
      <a href="#news" data-i="nav_news"></a>
      <a href="#contact" data-i="nav_contact"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button data-l="rw">Kinyarwanda</button>
      <button data-l="en">English</button>
      <button data-l="ar">العربية</button>
    </div>
  </div>
</header>

<div class="hero" id="top">
  <svg viewBox="0 0 200 200" aria-hidden="true" fill="none" stroke="#D9A441" stroke-width="1.2">
    <rect x="45" y="45" width="110" height="110"/>
    <rect x="45" y="45" width="110" height="110" transform="rotate(45 100 100)"/>
    <circle cx="100" cy="100" r="42"/>
  </svg>
  <div class="bismillah" lang="ar" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
  <div class="bis-t" data-i="bismillah"></div>
  <h1>Najm Sights TV</h1>
  <p class="tag" data-i="tagline"></p>
  <a class="btn" href="https://www.youtube.com/@najmsights" target="_blank" rel="noopener" data-i="subscribe"></a>
</div>

<section class="about" id="about">
  <h2 data-i="about_h"></h2>
  <p data-i="about_p"></p>
</section>

<section id="topics" style="padding-top:0">
  <h2 data-i="topics_h"></h2>
  <div class="topics">
    <div class="topic">
      <h3 data-i="t1_h"></h3>
      <p data-i="t1_p"></p>
      <a href="https://www.youtube.com/@najmsights" target="_blank" rel="noopener" data-i="watch"></a>
    </div>
    <div class="topic">
      <h3 data-i="t2_h"></h3>
      <p data-i="t2_p"></p>
      <a href="https://www.youtube.com/@najmsights" target="_blank" rel="noopener" data-i="watch"></a>
    </div>
    <div class="topic">
      <h3 data-i="t3_h"></h3>
      <p data-i="t3_p"></p>
      <a href="https://www.youtube.com/@najmsights" target="_blank" rel="noopener" data-i="watch"></a>
    </div>
  </div>
</section>

<section id="news" style="padding-top:0">
  <h2 data-i="news_h"></h2>
  <div id="posts"></div>
</section>

<section id="videos" style="padding-top:0">
  <h2 data-i="videos_h"></h2>
  <p data-i="videos_p"></p>
  <div class="video">
    <!-- Shows the channel's uploads and updates by itself when a new video is posted -->
    <iframe src="https://www.youtube.com/embed/videoseries?list=UUCtL_sVEXCkdNgR94ypvghw" title="Najm Sights TV" loading="lazy" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  </div>
  <a class="more" href="https://www.youtube.com/@najmsights/videos" target="_blank" rel="noopener" data-i="watch"></a>
</section>

<section class="contact" id="contact">
  <div class="in">
    <h2 data-i="contact_h"></h2>
    <p data-i="contact_p"></p>
    <ul>
      <li><span data-i="phone"></span>: <a href="tel:+250795578692" dir="ltr">+250 795 578 692</a></li>
      <li><span data-i="email"></span>: <a href="mailto:Najmsights@gmail.com">Najmsights@gmail.com</a></li>
    </ul>
    <form id="cform">
      <label for="fname" data-i="f_name"></label>
      <input type="text" id="fname" required>
      <label for="femail" data-i="f_email"></label>
      <input type="email" id="femail" required>
      <label for="fmessage" data-i="f_msg"></label>
      <textarea id="fmessage" required></textarea>
      <input type="checkbox" id="fbot" class="hp" tabindex="-1" autocomplete="off">
      <button type="submit" class="btn" data-i="f_send"></button>
      <p id="fmsg" role="status"></p>
    </form>
  </div>
</section>

<footer>© 2026 Najm Sights TV</footer>

<script>
var T = {
  rw: {
    nav_about:"Abo turi bo", nav_topics:"Ibyo twigisha", nav_videos:"Amashusho", nav_contact:"Twandikire",
    nav_news:"Amakuru", news_h:"Amakuru n’inyigisho", f_name:"Amazina yawe", f_email:"Imeri yawe", f_msg:"Ubutumwa", f_send:"Ohereza", f_ok:"Murakoze! Ubutumwa bwawe bwoherejwe.", f_err:"Ntibyashobotse. Ongera ugerageze.",
    videos_h:"Amashusho aheruka", videos_p:"Reba ibiganiro n’inyigisho bishya.",
    bismillah:"Mu izina rya Allah, Nyirimpuhwe, Nyirimbabazi",
    tagline:"Menya idini ya Islam mu buryo bworoshye kandi busobanutse.",
    subscribe:"Iyandikishe kuri YouTube",
    about_h:"Abo turi bo",
    about_p:"Najm Sights TV igamije kukumenyesha ibikorwa bijyanye n’idini ya Islam, binyuze mu kuvuga ubutumwa no mu biganiro.",
    topics_h:"Ibyo twigisha",
    t1_h:"Tajwiid", t1_p:"Amategeko yo gusoma Qur’an neza.",
    t2_h:"Inyuguti z’icyarabu", t2_p:"Uko inyuguti zisomwa n’uko wazimenya.",
    t3_h:"Ibiganiro n’ubutumwa", t3_p:"Ibiganiro n’inyigisho ku idini ya Islam.",
    watch:"Reba kuri YouTube",
    contact_h:"Twandikire", contact_p:"Wifuza kuvugana natwe cyangwa kudutera inkunga? Dukoresheje aya makuru:",
    phone:"Telefone", email:"Imeri"
  },
  en: {
    nav_about:"About", nav_topics:"Topics", nav_videos:"Videos", nav_contact:"Contact",
    nav_news:"News", news_h:"News and lessons", f_name:"Your name", f_email:"Your email", f_msg:"Message", f_send:"Send", f_ok:"Thank you! Your message was sent.", f_err:"Something went wrong. Please try again.",
    videos_h:"Latest videos", videos_p:"Watch our newest talks and lessons.",
    bismillah:"In the name of Allah, the Most Gracious, the Most Merciful",
    tagline:"Learn about Islam, simply and clearly.",
    subscribe:"Subscribe on YouTube",
    about_h:"About us",
    about_p:"Najm Sights TV shares Islamic activities and teaching through da’wah and discussions.",
    topics_h:"What we teach",
    t1_h:"Tajweed", t1_p:"The rules for reciting the Qur’an correctly.",
    t2_h:"Arabic letters", t2_p:"How the letters are read and how to recognise them.",
    t3_h:"Talks and discussions", t3_p:"Talks and lessons about Islam.",
    watch:"Watch on YouTube",
    contact_h:"Contact us", contact_p:"Want to talk to us or support the channel? Reach us here:",
    phone:"Phone", email:"Email"
  },
  ar: {
    nav_about:"من نحن", nav_topics:"ما نقدّمه", nav_videos:"المرئيات", nav_contact:"تواصل معنا",
    nav_news:"الأخبار", news_h:"الأخبار والدروس", f_name:"الاسم", f_email:"البريد الإلكتروني", f_msg:"الرسالة", f_send:"إرسال", f_ok:"شكراً لك! تم إرسال رسالتك.", f_err:"حدث خطأ. حاول مرة أخرى.",
    videos_h:"أحدث المرئيات", videos_p:"شاهد أحدث المحاضرات والدروس.",
    bismillah:"",
    tagline:"تعلّم عن الإسلام ببساطة ووضوح.",
    subscribe:"اشترك في قناتنا على يوتيوب",
    about_h:"من نحن",
    about_p:"تهدف قناة نجم سايتس إلى التعريف بالأنشطة الإسلامية من خلال الدعوة والحوارات.",
    topics_h:"ما نقدّمه",
    t1_h:"التجويد", t1_p:"أحكام تلاوة القرآن الكريم.",
    t2_h:"الحروف العربية", t2_p:"كيف تُقرأ الحروف وكيف نتعرّف عليها.",
    t3_h:"محاضرات وحوارات", t3_p:"محاضرات ودروس عن الإسلام.",
    watch:"شاهد على يوتيوب",
    contact_h:"تواصل معنا", contact_p:"هل ترغب في التواصل معنا أو دعم القناة؟ تجدنا هنا:",
    phone:"الهاتف", email:"البريد الإلكتروني"
  }
};

function setLang(l) {
  var d = T[l];
  document.documentElement.lang = l;
  document.documentElement.dir = (l === "ar") ? "rtl" : "ltr";
  var els = document.querySelectorAll("[data-i]");
  for (var i = 0; i < els.length; i++) {
    els[i].textContent = d[els[i].getAttribute("data-i")];
  }
  var bs = document.querySelectorAll(".lang button");
  for (var j = 0; j < bs.length; j++) {
    bs[j].setAttribute("aria-pressed", bs[j].getAttribute("data-l") === l ? "true" : "false");
  }
  try { localStorage.setItem("najm_lang", l); } catch (e) {}
  renderPosts();
}

var bs = document.querySelectorAll(".lang button");
for (var k = 0; k < bs.length; k++) {
  bs[k].addEventListener("click", function () { setLang(this.getAttribute("data-l")); });
}

var posts = [];

function renderPosts() {
  var box = document.getElementById("posts");
  var l = document.documentElement.lang;
  box.innerHTML = "";
  for (var i = 0; i < posts.length; i++) {
    var c = posts[i][l] || posts[i].en || posts[i].rw;
    if (!c || !c.title) { continue; }
    var div = document.createElement("div");
    div.className = "post";
    var d = document.createElement("small");
    d.textContent = posts[i].date;
    var h = document.createElement("h3");
    h.textContent = c.title;
    var t = document.createElement("p");
    t.textContent = c.text;
    div.appendChild(d);
    div.appendChild(h);
    div.appendChild(t);
    box.appendChild(div);
  }
  document.getElementById("news").style.display = box.children.length ? "" : "none";
}

fetch("posts.json")
  .then(function (r) { return r.json(); })
  .then(function (data) { posts = data; renderPosts(); })
  .catch(function () { renderPosts(); });

document.getElementById("cform").addEventListener("submit", function (e) {
  e.preventDefault();
  var f = e.target;
  var msg = document.getElementById("fmsg");
  var d = T[document.documentElement.lang];
  var data = {
    access_key: "YOUR_WEB3FORMS_KEY",
    subject: "Najm Sights website message",
    name: document.getElementById("fname").value,
    email: document.getElementById("femail").value,
    message: document.getElementById("fmessage").value,
    botcheck: document.getElementById("fbot").checked
  };
  fetch("https://api.web3forms.com/submit", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify(data)
  })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.success) { msg.textContent = d.f_ok; f.reset(); }
      else { msg.textContent = d.f_err; }
    })
    .catch(function () { msg.textContent = d.f_err; });
});

var start = "rw";
try { start = localStorage.getItem("najm_lang") || "rw"; } catch (e) {}
setLang(T[start] ? start : "rw");
</script>
</body>
</html>
